name: Deploy Operational Dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'analysis/operational_decision_view_v1_bundle/operational_decision_view_v1_index_refined.html'
      - '.github/workflows/deploy_dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare dashboard site
        run: |
          mkdir -p site
          cp analysis/operational_decision_view_v1_bundle/operational_decision_view_v1_index_refined.html site/index.html
          touch site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
