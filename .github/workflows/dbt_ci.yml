name: Frozen Fixture dbt CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-build:
    name: Validate frozen fixture and build dbt models
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: forensic_kpi
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d forensic_kpi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate frozen raw CSV fixture
        run: python scripts/validate_frozen_fixture.py

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Install dbt adapter
        run: |
          python -m pip install --upgrade pip
          python -m pip install "dbt-core==1.12.0" "dbt-postgres==1.11.0"

      - name: Configure dbt profile
        run: |
          mkdir -p "$HOME/.dbt"
          cat > "$HOME/.dbt/profiles.yml" <<'YAML'
          ecommerce_forensic_KPI:
            target: ci
            outputs:
              ci:
                type: postgres
                host: localhost
                port: 5432
                user: postgres
                password: ci_test_password
                dbname: forensic_kpi
                schema: public
                threads: 4
          YAML

      - name: Verify database connection
        run: dbt debug

      - name: Install dbt packages
        run: dbt deps

      - name: Load frozen raw fixture into PostgreSQL
        env:
          PGPASSWORD: ci_test_password
        run: psql --host localhost --username postgres --dbname forensic_kpi --set ON_ERROR_STOP=1 --file raw_schema_init.sql

      - name: Load dbt seed data
        run: dbt seed --full-refresh

      - name: Build and test dbt models
        run: dbt build --store-failures
