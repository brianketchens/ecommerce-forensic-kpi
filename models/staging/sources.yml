version: 2

sources:
  - name: raw_data
    description: "Raw operational data generated by the V2 e-commerce fulfillment simulation."
    schema: raw_data

    tables:
      - name: raw_customers
        description: "Customer master data."

      - name: raw_products
        description: "Product and SKU master data."

      - name: raw_orders
        description: "Order-level demand, completion, and SLA observations."

      - name: raw_order_items
        description: "Order-line detail linking orders to products."

      - name: raw_shift_logs
        description: "Scheduled and actual labor observations by shift."

      - name: raw_hourly_capacity
        description: "Hourly system and constrained operational capacity."

      - name: raw_hourly_demand
        description: "Hourly incoming demand and throughput observations."

      - name: raw_hourly_backlog
        description: "Hourly backlog state and throughput reconciliation."

      - name: raw_kpi_telemetry
        description: "Hourly KPI observations and operational conditions."

      - name: raw_incident_logs
        description: "Operational incidents and their T0-T5 response timelines."